name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      COMPOSER_ROOT_VERSION: 1.0.0

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
        filament: ['^4.0', '^5.0']

    name: PHP ${{ matrix.php }} / Filament ${{ matrix.filament }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Resolve dependency matrix
        run: composer update --with "filament/filament:${{ matrix.filament }}" --with-all-dependencies --no-interaction --prefer-dist

      - name: Verify generated theme assets
        run: node bin/verify.mjs

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Check formatting
        run: vendor/bin/pint --test
